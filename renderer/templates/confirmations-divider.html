<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JET · Your Confirmations</title>
<link rel="stylesheet" href="../styles/base.css">
<style>
  .divider {
    padding: 0 1.0in;
    height: 11in;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  .divider-eyebrow {
    font-family: var(--font-label);
    font-weight: 500;
    font-size: 8pt;
    letter-spacing: 0.40em;
    text-indent: 0.40em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .divider-title {
    margin-top: 0.18in;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 64pt;
    line-height: 1;
    letter-spacing: 0.005em;
    color: var(--ink);
  }

  .divider-script {
    margin-top: 0.20in;
    font-family: var(--font-script);
    color: var(--accent);
    font-size: 36pt;
    line-height: 1;
  }

  .divider-body {
    margin-top: 0.55in;
    margin-left: auto;
    margin-right: auto;
    max-width: 4.5in;
    font-family: var(--font-body);
    font-size: 11.5pt;
    line-height: 1.6;
    color: var(--ink);
  }
</style>
</head>
<body>
<section class="page divider">
  <div class="divider-eyebrow">For Your Records</div>
  <h1 class="divider-title">Your Confirmations</h1>
  <div class="divider-script">All in one place</div>

  <p class="divider-body">
    The pages that follow are the original confirmations for every booking on this trip — flights, hotel, dining, and activities. Save them, print them, or simply have them on your phone in case anything is asked en route.
  </p>
</section>
</body>
</html>
