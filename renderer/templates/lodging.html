<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JET · Amalfi Coast — Le Sirenuse</title>
<link rel="stylesheet" href="../styles/base.css">
<style>
  .lodging {
    padding: 1.1in 1in 0.9in;
    text-align: center;
  }

  .lodging-photo-wrap {
    display: grid;
    place-items: center;
  }
  .lodging-photo {
    width: 5in;
    height: 3.2in;
  }

  .lodging-title {
    margin-top: 0.7in;
    font-family: var(--font-display);
    font-weight: 100;
    font-size: 46pt;
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--ink);
  }

  .lodging-tagline {
    margin-top: 0.25in;
    margin-left: auto;
    margin-right: auto;
    font-family: var(--font-body);
    font-style: italic;
    font-size: 13pt;
    color: var(--ink-soft);
    max-width: 4.6in;
    line-height: 1.45;
  }

  .lodging-details {
    margin-top: 0.55in;
    font-family: var(--font-label);
    font-weight: 500;
    font-size: 8pt;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1.9;
  }
  .lodging-details .soft {
    color: var(--ink-mute);
  }

  .folio {
    position: absolute;
    bottom: 0.6in;
    right: 1in;
    font-family: var(--font-label);
    font-weight: 500;
    font-size: 7pt;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
</style>
</head>
<body>
<section class="page lodging">

  <div class="lodging-photo-wrap">
    <div class="photo lodging-photo" data-caption="PROPERTY PHOTOGRAPH"></div>
  </div>

  <h2 class="lodging-title">Le Sirenuse</h2>

  <div class="lodging-tagline">
    A Sersale family villa overlooking the Tyrrhenian since 1951.
  </div>

  <div class="lodging-details">
    Junior Suite &nbsp;·&nbsp; Sea-view terrace<br>
    <span class="soft">14 — 18 June 2026</span>
  </div>

  <div class="folio">04</div>

</section>
</body>
</html>
