<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JET · Amalfi Coast — Cover</title>
<link rel="stylesheet" href="../styles/base.css">
<style>
  .cover {
    padding: 0.85in 1in 0.9in;
  }

  .cover-mark {
    text-align: center;
  }
  .cover-mark .jet {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 16pt;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--ink);
  }
  .cover-mark .name {
    margin-top: 8pt;
    font-family: var(--font-label);
    font-weight: 400;
    font-size: 7pt;
    letter-spacing: 0.36em;
    text-indent: 0.36em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .cover-photo-wrap {
    margin-top: 0.55in;
    display: grid;
    place-items: center;
  }
  .cover-photo {
    width: 4.2in;
    height: 4.9in;
  }

  .cover-title-block {
    text-align: center;
    margin-top: 0.7in;
  }
  .cover-title {
    font-family: var(--font-display);
    font-weight: 100;
    font-size: 52pt;
    line-height: 1;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  .cover-meta {
    margin-top: 0.42in;
    font-family: var(--font-body);
    font-style: italic;
    font-size: 14pt;
    color: var(--ink);
  }
  .cover-dates {
    margin-top: 0.18in;
    font-family: var(--font-label);
    font-weight: 500;
    font-size: 8pt;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
</style>
</head>
<body>
<section class="page cover">

  <header class="cover-mark">
    <div class="jet">JET</div>
    <div class="name">Joanna Elizabeth Travel</div>
  </header>

  <div class="cover-photo-wrap">
    <div class="photo cover-photo" data-caption="HERO PHOTOGRAPH"></div>
  </div>

  <div class="cover-title-block">
    <h1 class="cover-title">Amalfi Coast</h1>
    <div class="cover-meta">The Garner Family</div>
    <div class="cover-dates">14 — 22 June 2026</div>
  </div>

</section>
</body>
</html>
