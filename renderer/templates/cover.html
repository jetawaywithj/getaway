<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JET · A Birthday Celebration for Jennifer & Philip — Cover</title>
<link rel="stylesheet" href="../styles/base.css">
<style>
  body { background: var(--paper-soft); }

  .cover-photo {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6.4in;
    background: #DCD2BD;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cover-photo::before {
    content: 'HERO PHOTOGRAPH · SAINT-JEAN BAY';
    font-family: var(--font-label);
    font-size: 7pt;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(31, 54, 65, 0.45);
  }

  .cover-block {
    position: absolute;
    top: 6.4in;
    left: 0; right: 0;
    bottom: 0;
    padding: 0.7in 1in 0.85in;
    text-align: center;
    background: var(--paper-soft);
  }

  .brand-mark {
    font-family: var(--font-label);
    font-weight: 500;
    font-size: 7.5pt;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .cover-title {
    margin-top: 0.32in;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 26pt;
    line-height: 1.18;
    color: var(--ink);
    letter-spacing: 0.005em;
  }

  .cover-destination {
    margin-top: 0.15in;
    font-family: var(--font-script);
    color: var(--accent);
    font-size: 56pt;
    line-height: 1;
    letter-spacing: -0.005em;
  }

  .cover-dates {
    margin-top: 0.42in;
    font-family: var(--font-label);
    font-weight: 500;
    font-size: 8pt;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<section class="page">
  <div class="cover-photo"></div>
  <div class="cover-block">
    <div class="brand-mark">JET · Joanna Elizabeth Travel</div>
    <h1 class="cover-title">A Birthday Celebration for<br>Jennifer &amp; Philip</h1>
    <div class="cover-destination">Saint Barthélemy</div>
    <div class="cover-dates">Friday, May 1 — Wednesday, May 6, 2026</div>
  </div>
</section>
</body>
</html>
