<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JET · Amalfi Coast — Cover</title>
<link rel="stylesheet" href="../styles/base.css">
<style>
  .cover {
    padding: 0.7in 1in 0.7in;
  }

  .cover-mark {
    text-align: center;
  }
  .cover-mark .jet {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 15pt;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--ink);
  }
  .cover-mark .signature {
    font-family: var(--font-script);
    font-weight: 400;
    font-size: 13pt;
    color: var(--ink-soft);
    margin-top: 2pt;
  }

  .cover-photo-wrap {
    margin-top: 0.4in;
    display: grid;
    place-items: center;
  }
  .cover-photo {
    width: 4in;
    height: 4.6in;
  }
  .cover-photo-caption {
    margin-top: 0.16in;
    text-align: center;
  }

  .cover-title-block {
    text-align: center;
    margin-top: 0.55in;
  }

  .cover-title {
    font-family: var(--font-display);
    font-weight: 100;
    font-size: 50pt;
    line-height: 1;
    letter-spacing: 0.04em;
    color: var(--ink);
  }

  .cover-prepared {
    margin-top: 0.32in;
    font-family: var(--font-body);
    font-style: italic;
    font-size: 11.5pt;
    color: var(--ink-soft);
  }

  .cover-client {
    margin-top: 2pt;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15pt;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  .cover-dates {
    margin-top: 0.22in;
    font-family: var(--font-label);
    font-weight: 500;
    font-size: 8pt;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink);
  }
</style>
</head>
<body>
<section class="page cover">

  <header class="cover-mark">
    <div class="jet">JET</div>
    <div class="signature">Joanna Elizabeth Travel</div>
  </header>

  <div class="cover-photo-wrap">
    <div class="photo cover-photo" data-caption="HERO PHOTOGRAPH"></div>
    <div class="caption cover-photo-caption">Positano · Amalfi Coast</div>
  </div>

  <div class="cover-title-block">
    <h1 class="cover-title">Amalfi Coast</h1>
    <div class="cover-prepared">An itinerary for</div>
    <div class="cover-client">The Garner Family</div>
    <div class="cover-dates">14 — 22 June 2026</div>
  </div>

</section>
</body>
</html>
